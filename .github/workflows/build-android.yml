name: Build Android

env:
  NDK_VERSION: r29

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 26.6.27)'
        required: true
        type: string
      commit_hash:
        description: 'Commit hash (optional, defaults to latest commit)'
        required: false
        type: string

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: build-android
      cancel-in-progress: false
    env:
      VER: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_hash || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Build Android Library
        run: python3 build/main.py android

      - name: Rename artifacts
        run: |
          mv libXray.aar "libXray-${VER}.aar"
          mv libXray-sources.jar "libXray-sources-${VER}.jar"

      - name: Deploy to Maven repository
        run: |
          mvn deploy:deploy-file \
            -DgroupId=io.github.homa-games \
            -DartifactId=libXray \
            -Dversion=${VER} \
            -Dpackaging=aar \
            -Dfile="libXray-${VER}.aar" \
            -Dsources="libXray-sources-${VER}.jar" \
            -DrepositoryId=repo \
            -Durl="file://$(pwd)/repo" \
            --batch-mode

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git commit -m "Deploy libXray ${VER}"
          git push

      - name: Upload universal Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libXray-android-${{ inputs.version }}
          path: |
            libXray-${{ inputs.version }}.aar
            libXray-sources-${{ inputs.version }}.jar
          if-no-files-found: error
